# Synthetic copy-task configuration.
# Special tokens are reserved by src/reconstruct_transformer/data.py:
#   PAD = 0, BOS = 1, EOS = 2, content tokens = 3 .. vocab_size - 1.

seed: 0
vocab_size: 11
min_len: 2
max_len: 8
train_size: 2048
val_size: 256
batch_size: 32

model:
  d_model: 64
  num_heads: 4
  ffn_hidden: 128
  num_layers: 2
  dropout: 0.0          # disabled: the tiny copy task overfits without regularization
  max_len: 32

optimizer:
  name: adam
  learning_rate: 0.0003
  beta1: 0.9
  beta2: 0.98
  eps: 1.0e-9

training:
  epochs: 60
  steps: null          # optional: run a fixed number of steps instead of epochs
  grad_clip_norm: 1.0
  warmup_steps: 400

device: auto           # 'auto' selects CUDA when available, otherwise CPU
output_dir: outputs/copy_task
