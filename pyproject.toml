[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "reconstruct-transformer"
version = "0.1.0"
description = "A tested, from-first-principles reconstruction of the encoder-decoder Transformer."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "IrisGValerie", email = "25722055@bjtu.edu.cn" }]
dependencies = [
    "matplotlib>=3.10,<4",
    "numpy>=2.2,<3",
    "pyyaml>=6.0,<7",
    "torch>=2.11,<3",
    "tqdm>=4.67,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
